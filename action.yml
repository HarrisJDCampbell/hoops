name: Contribution Hoops
description: Turn your GitHub contribution graph into an animated basketball shootaround for your profile README.
author: Harris Campbell

branding:
  icon: circle
  color: orange

inputs:
  github_user_name:
    description: Whose contribution calendar to play.
    default: ${{ github.repository_owner }}
  github_token:
    description: Token used to read the public contribution calendar. The default workflow token works.
    default: ${{ github.token }}
  out_dir:
    description: Folder to write hoops.svg (light) and hoops-dark.svg (dark) into.
    default: dist
  jersey:
    description: A preset (blue-gold, purple-gold, green-white, red-white, orange-navy, black-teal) or two hex colours, "primary,trim".
    default: blue-gold
  skin:
    description: The player's skin tone, as a hex colour.
    default: "#c68b59"
  pace:
    description: How slowly he plays, from 0.25 (quick) to 4 (very relaxed). 1 is about 3 seconds per shot.
    default: "1"
  order:
    description: Order to play the calendar (oldest-first, newest-first).
    default: oldest-first

outputs:
  light:
    description: Path of the light-theme SVG.
  dark:
    description: Path of the dark-theme SVG.

runs:
  using: node24
  main: src/index.mjs
