name: Idea or feature
description: Suggest something hoops could do
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like it to do?
      description: What you'd see in the animation, or the option you'd set.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why?
      description: What it would make better, and for whom.
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to build this myself
